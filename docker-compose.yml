services:
  mysql:
    image: mysql:8.4
    container_name: visitflow_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: RootPassword@2026
      MYSQL_DATABASE: visitflow_db
      MYSQL_USER: visitflow_app
      MYSQL_PASSWORD: AppPassword@2026
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: visitflow_backend
    restart: always
    environment:
      DATABASE_URL: mysql+pymysql://visitflow_app:AppPassword@2026@mysql:3306/visitflow_db
      JWT_SECRET: e5b61fa2d3c4b5a6f7e8d9c0b1a23456789abcdef0123456789abcdef0123456
      ENVIRONMENT: production
      CORS_ORIGINS: "http://localhost:3000,http://localhost:5173"
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
